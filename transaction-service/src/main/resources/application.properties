spring.application.name=transaction-service

server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:transaction_db}
spring.datasource.username=${DB_USER:transaction_user}
spring.datasource.password=${DB_PASSWORD:transaction_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.transaction-created=transaction-created

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
