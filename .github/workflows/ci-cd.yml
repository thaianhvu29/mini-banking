name: Mini Banking CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_all:
        description: Build and deploy all services
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /home/thaianhvu/mini-banking-deploy

  # Keep the same Docker Compose project identity even though
  # deployment is executed from ~/mini-banking-deploy.
  COMPOSE_PROJECT_NAME: mini-banking

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ALL_SERVICES=(
            "account-service"
            "transaction-service"
            "payment-service"
            "audit-service"
            "notification-service"
            "gateway-service"
          )

          SELECTED_SERVICES=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_all }}" == "true" ]]; then
            echo "force_all enabled"
            SELECTED_SERVICES=("${ALL_SERVICES[@]}")
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            else
              BASE_SHA="$(git rev-parse HEAD~1)"
              HEAD_SHA="$(git rev-parse HEAD)"
            fi

            echo "Base SHA: ${BASE_SHA}"
            echo "Head SHA: ${HEAD_SHA}"

            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"

            echo "Changed files:"
            echo "${CHANGED_FILES}"

            if echo "${CHANGED_FILES}" | grep -Eq '^(\.github/workflows/ci-cd\.yml|docker-compose\.yml|\.env\.example)$'; then
              echo "Shared deployment configuration changed."
              SELECTED_SERVICES=("${ALL_SERVICES[@]}")
            else
              for SERVICE in "${ALL_SERVICES[@]}"; do
                if echo "${CHANGED_FILES}" | grep -q "^${SERVICE}/"; then
                  SELECTED_SERVICES+=("${SERVICE}")
                fi
              done
            fi
          fi

          if [[ ${#SELECTED_SERVICES[@]} -eq 0 ]]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo "No deployable service changes detected."
            exit 0
          fi

          SERVICES_JSON="$(
            printf '%s\n' "${SELECTED_SERVICES[@]}" |
            jq -R . |
            jq -s -c .
          )"

          echo "Selected services: ${SERVICES_JSON}"

          echo "services=${SERVICES_JSON}" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build - ${{ matrix.service }}

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Maven test and package
        shell: bash
        run: |
          set -euo pipefail

          mvn -B package \
            -f "${{ matrix.service }}/pom.xml"

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${{ github.repository_owner }}/mini-banking-${{ matrix.service }}:${GITHUB_SHA}"

          echo "Building image:"
          echo "${IMAGE}"

          docker build \
            -t "${IMAGE}" \
            "${{ matrix.service }}"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable SHA image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${{ github.repository_owner }}/mini-banking-${{ matrix.service }}:${GITHUB_SHA}"

          echo "Pushing:"
          echo "${IMAGE}"

          docker push "${IMAGE}"

  deploy:
    name: Deploy - ${{ matrix.service }}

    needs:
      - detect-changes
      - build

    if: >
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.has_changes == 'true'

    runs-on:
      - self-hosted
      - Linux
      - X64

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Update deployment repository
        shell: bash
        run: |
          set -euo pipefail

          cd "${DEPLOY_DIR}"

          FETCH_SUCCESS=false

          for ATTEMPT in 1 2 3; do
            echo "Git fetch attempt ${ATTEMPT}/3"

            if git fetch origin main; then
              FETCH_SUCCESS=true
              break
            fi

            if [[ "${ATTEMPT}" -lt 3 ]]; then
              echo "GitHub connection failed. Retrying..."
              sleep $((ATTEMPT * 5))
            fi
          done

          if [[ "${FETCH_SUCCESS}" != "true" ]]; then
            echo "Unable to fetch origin/main after 3 attempts."
            exit 1
          fi

          git checkout main
          git reset --hard origin/main

      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Configure immutable image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          cd "${DEPLOY_DIR}"

          IMAGE="${REGISTRY}/${{ github.repository_owner }}/mini-banking-${SERVICE}:${GITHUB_SHA}"

          case "${SERVICE}" in
            account-service)
              IMAGE_VAR="ACCOUNT_SERVICE_IMAGE"
              ;;
            transaction-service)
              IMAGE_VAR="TRANSACTION_SERVICE_IMAGE"
              ;;
            payment-service)
              IMAGE_VAR="PAYMENT_SERVICE_IMAGE"
              ;;
            audit-service)
              IMAGE_VAR="AUDIT_SERVICE_IMAGE"
              ;;
            notification-service)
              IMAGE_VAR="NOTIFICATION_SERVICE_IMAGE"
              ;;
            gateway-service)
              IMAGE_VAR="GATEWAY_SERVICE_IMAGE"
              ;;
            *)
              echo "Unknown service: ${SERVICE}"
              exit 1
              ;;
          esac

          touch .env

          if grep -q "^${IMAGE_VAR}=" .env; then
            sed -i \
              "s|^${IMAGE_VAR}=.*|${IMAGE_VAR}=${IMAGE}|" \
              .env
          else
            echo "${IMAGE_VAR}=${IMAGE}" >> .env
          fi

          echo "Configured deployment image:"
          echo "${IMAGE_VAR}=${IMAGE}"

      - name: Pull and deploy service
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          cd "${DEPLOY_DIR}"

          echo "Compose project: ${COMPOSE_PROJECT_NAME}"
          echo "Deploying service: ${SERVICE}"

          docker compose pull "${SERVICE}"

          docker compose up \
            -d \
            --no-deps \
            "${SERVICE}"

      - name: Validate deployment
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          cd "${DEPLOY_DIR}"

          CONTAINER_ID="$(docker compose ps -q "${SERVICE}")"

          if [[ -z "${CONTAINER_ID}" ]]; then
            echo "Container not found for ${SERVICE}"
            exit 1
          fi

          HAS_HEALTH="$(
            docker inspect \
              --format '{{if .State.Health}}yes{{else}}no{{end}}' \
              "${CONTAINER_ID}"
          )"

          if [[ "${HAS_HEALTH}" == "yes" ]]; then
            echo "Waiting for ${SERVICE} health check..."

            for ATTEMPT in $(seq 1 36); do
              STATUS="$(
                docker inspect \
                  --format '{{.State.Status}}' \
                  "${CONTAINER_ID}"
              )"

              HEALTH="$(
                docker inspect \
                  --format '{{.State.Health.Status}}' \
                  "${CONTAINER_ID}"
              )"

              echo "Attempt ${ATTEMPT}/36: status=${STATUS}, health=${HEALTH}"

              if [[ "${HEALTH}" == "healthy" ]]; then
                echo "${SERVICE} deployment validated."
                exit 0
              fi

              if [[ "${HEALTH}" == "unhealthy" || "${STATUS}" == "exited" ]]; then
                echo "${SERVICE} deployment failed."
                docker logs --tail 100 "${CONTAINER_ID}" || true
                exit 1
              fi

              sleep 10
            done

            echo "${SERVICE} did not become healthy in time."
            docker logs --tail 100 "${CONTAINER_ID}" || true
            exit 1
          fi

          echo "${SERVICE} has no Docker healthcheck."
          echo "Waiting 20 seconds before runtime validation..."

          sleep 20

          STATUS="$(
            docker inspect \
              --format '{{.State.Status}}' \
              "${CONTAINER_ID}"
          )"

          if [[ "${STATUS}" != "running" ]]; then
            echo "${SERVICE} is not running."
            docker logs --tail 100 "${CONTAINER_ID}" || true
            exit 1
          fi

          echo "${SERVICE} is running."
