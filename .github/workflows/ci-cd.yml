name: Mini Banking CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_all:
        description: Build and deploy all services
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:

  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ALL_SERVICES=(
            account-service
            transaction-service
            payment-service
            audit-service
            notification-service
            gateway-service
          )

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_all }}" == "true" ]]; then
            SERVICES=("${ALL_SERVICES[@]}")
          else

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE="${{ github.event.pull_request.base.sha }}"
            else
              BASE="${{ github.event.before }}"
            fi

            HEAD="${{ github.sha }}"

            if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
              BASE="$(git rev-list --max-parents=0 "${HEAD}")"
            fi

            echo "Comparing:"
            echo "BASE=${BASE}"
            echo "HEAD=${HEAD}"

            CHANGED_FILES="$(git diff --name-only "${BASE}" "${HEAD}")"

            echo "Changed files:"
            echo "${CHANGED_FILES}"

            SERVICES=()

            for SERVICE in "${ALL_SERVICES[@]}"; do
              if grep -q "^${SERVICE}/" <<< "${CHANGED_FILES}"; then
                SERVICES+=("${SERVICE}")
              fi
            done

            if grep -Eq '^(docker-compose\.yml|\.github/workflows/ci-cd\.yml)$' <<< "${CHANGED_FILES}"; then
              SERVICES=("${ALL_SERVICES[@]}")
            fi
          fi

          if (( ${#SERVICES[@]} == 0 )); then
            JSON='[]'
            HAS_CHANGES=false
          else
            JSON="$(
              printf '%s\n' "${SERVICES[@]}" \
                | jq -R . \
                | jq -s -c .
            )"
            HAS_CHANGES=true
          fi

          echo "Detected services: ${JSON}"

          echo "services=${JSON}" >> "${GITHUB_OUTPUT}"
          echo "has_changes=${HAS_CHANGES}" >> "${GITHUB_OUTPUT}"

  build:
    needs:
      - detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven test and package
        shell: bash
        run: |
          mvn -B package -f "${{ matrix.service }}/pom.xml"

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t "mini-banking/${{ matrix.service }}:ci-${GITHUB_SHA}" \
            "${{ matrix.service }}"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable SHA image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mini-banking-${{ matrix.service }}:${GITHUB_SHA}"

          docker tag \
            "mini-banking/${{ matrix.service }}:ci-${GITHUB_SHA}" \
            "${IMAGE}"

          docker push "${IMAGE}"

          echo "Published ${IMAGE}"

  deploy:
    needs:
      - detect-changes
      - build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Login server to GHCR
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | ssh "${SERVER_USER}@${SERVER_HOST}" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy changed service
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVICE: ${{ matrix.service }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mini-banking-${{ matrix.service }}:${{ github.sha }}
        run: |
          ssh "${SERVER_USER}@${SERVER_HOST}" \
            bash -s -- "${SERVICE}" "${IMAGE}" <<'REMOTE'
          set -euo pipefail

          SERVICE="$1"
          IMAGE="$2"

          cd ~/mini-banking

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          case "${SERVICE}" in
            account-service)
              IMAGE_VAR="ACCOUNT_SERVICE_IMAGE"
              ;;
            transaction-service)
              IMAGE_VAR="TRANSACTION_SERVICE_IMAGE"
              ;;
            payment-service)
              IMAGE_VAR="PAYMENT_SERVICE_IMAGE"
              ;;
            audit-service)
              IMAGE_VAR="AUDIT_SERVICE_IMAGE"
              ;;
            notification-service)
              IMAGE_VAR="NOTIFICATION_SERVICE_IMAGE"
              ;;
            gateway-service)
              IMAGE_VAR="GATEWAY_SERVICE_IMAGE"
              ;;
            *)
              echo "Unknown service: ${SERVICE}"
              exit 1
              ;;
          esac

          touch .env

          if grep -q "^${IMAGE_VAR}=" .env; then
            sed -i "s|^${IMAGE_VAR}=.*|${IMAGE_VAR}=${IMAGE}|" .env
          else
            echo "${IMAGE_VAR}=${IMAGE}" >> .env
          fi

          echo "Pulling ${IMAGE}"
          docker pull "${IMAGE}"

          echo "Deploying ${SERVICE}"
          docker compose up -d --no-deps "${SERVICE}"

          HAS_HEALTH="$(
            docker inspect \
              --format '{{if .State.Health}}yes{{else}}no{{end}}' \
              "${SERVICE}"
          )"

          if [[ "${HAS_HEALTH}" == "yes" ]]; then

            for ATTEMPT in $(seq 1 36); do
              STATUS="$(
                docker inspect \
                  --format '{{.State.Health.Status}}' \
                  "${SERVICE}"
              )"

              echo "${SERVICE} health=${STATUS}"

              if [[ "${STATUS}" == "healthy" ]]; then
                echo "${SERVICE} deployment successful"
                exit 0
              fi

              if [[ "${STATUS}" == "unhealthy" ]]; then
                docker logs "${SERVICE}" --tail 100
                exit 1
              fi

              sleep 10
            done

            echo "${SERVICE} health validation timed out"
            docker logs "${SERVICE}" --tail 100
            exit 1

          else

            sleep 20

            STATUS="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "${SERVICE}"
            )"

            echo "${SERVICE} status=${STATUS}"

            if [[ "${STATUS}" != "running" ]]; then
              docker logs "${SERVICE}" --tail 100
              exit 1
            fi

            echo "${SERVICE} deployment successful"
          fi
          REMOTE
